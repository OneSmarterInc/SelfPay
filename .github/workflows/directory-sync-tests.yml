name: Directory sync tests
on:
  push:
    paths:
      - 'directory_sync.py'
      - 'publish_directory.py'
      - 'ops/directory*'
      - 'test_directory_sync*'
      - 'tests/fixtures/directory-*'
      - '.github/workflows/directory-sync*'
  pull_request:
    paths:
      - 'directory_sync.py'
      - 'publish_directory.py'
      - 'ops/directory*'
      - 'test_directory_sync*'
      - 'tests/fixtures/directory-*'
      - '.github/workflows/directory-sync*'
permissions:
  contents: read
jobs:
  directory-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact hash-verified distributions
        run: python -m pip install --require-hashes -r ops/directory-requirements.txt -r ops/directory-export-requirements.txt
      - name: Offline export, schema, source and mapping regressions
        run: python -m unittest test_directory_sync -v
      - name: Start disposable local database only
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER SYSTEM SET neon.branch_id = 'br-rapid-mouse-b7clh18t';"
          sudo systemctl restart postgresql.service
          sudo -u postgres psql -c "CREATE USER directory_test WITH SUPERUSER PASSWORD 'local-directory-test-only';"
          sudo -u postgres psql -c "CREATE DATABASE neondb OWNER directory_test;"
      - name: PostgreSQL permissions, atomicity, idempotence and fail-closed checks
        env:
          DIRECTORY_SYNC_TEST_ALLOW_RESET: '1'
          DIRECTORY_SYNC_TEST_DATABASE_URL: postgresql://directory_test:local-directory-test-only@127.0.0.1/neondb
        run: python -m unittest test_directory_sync_postgres -v
