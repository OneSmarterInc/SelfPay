name: Directory sync
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish the validated directory (false is a read-only dry-run)
        type: boolean
        default: false
        required: true
      expected_active:
        description: Optional reviewed active batch; mismatch aborts
        type: string
        required: false
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: selfpay-directory-sync
  cancel-in-progress: false
jobs:
  sync:
    # A manual read-only check does not enable scheduled/live publication.
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.apply == false) || vars.SELFPAY_DIRECTORY_SYNC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: directory-sync
    steps:
      - name: Check out trusted code at the triggering main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out data only (never execute data-branch code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: directory-data
          path: directory-input
          persist-credentials: false
          sparse-checkout: directory
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned importer dependencies before exposing the secret
        run: python -m pip install --require-hashes -r ops/directory-requirements.txt
      - name: Validate untrusted data without database access
        run: python directory_sync.py validate directory-input/directory/current.json --allow-old-export
      - name: Check or publish atomically through the restricted database function
        env:
          SELFPAY_DIRECTORY_DATABASE_URL: ${{ secrets.SELFPAY_DIRECTORY_DATABASE_URL }}
          SYNC_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          SYNC_EXPECTED_ACTIVE: ${{ inputs.expected_active }}
        run: |
          args=(sync directory-input/directory/current.json)
          if [[ "$SYNC_APPLY" == 'true' ]]; then args+=(--apply); fi
          if [[ -n "$SYNC_EXPECTED_ACTIVE" ]]; then args+=(--expected-active "$SYNC_EXPECTED_ACTIVE"); fi
          python directory_sync.py "${args[@]}"
