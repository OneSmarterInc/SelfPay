name: Daily SQL database branch
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      approved_test_backup_2026_10_12:
        description: 'One-time Oct 12 backup of owner-confirmed test users'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: selfpay-database-backup
  cancel-in-progress: false
jobs:
  export:
    if: vars.BACKUPS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.approved_test_backup_2026_10_12)
    runs-on: ubuntu-latest
    container: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    timeout-minutes: 30
    environment: database-backups
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install backup tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-psycopg2 git ca-certificates tzdata
      - name: Verify dump-only branch construction
        run: python3 -m unittest discover -s ops/backup -p 'test_*.py'
      - name: Export SQL and create dated branch
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_EXPECTED_HOST: ${{ vars.BACKUP_EXPECTED_HOST }}
          BACKUP_DATA_CLASS: ${{ vars.BACKUP_DATA_CLASS }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_APPROVED_TEST_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_test_backup_2026_10_12 && '2026-10-12' || '' }}
        run: python3 ops/backup/export.py

