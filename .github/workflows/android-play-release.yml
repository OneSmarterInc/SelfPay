name: Android Play release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-play-release.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint debug variant
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify signing secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE: ${{ secrets.MYSELFPAY_UPLOAD_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.MYSELFPAY_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MYSELFPAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MYSELFPAY_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret: $v"; exit 1; fi
          done
      - name: Decode upload keystore
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE: ${{ secrets.MYSELFPAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/myselfpay-upload.jks"
          chmod 600 "$RUNNER_TEMP/myselfpay-upload.jks"
      - name: Build signed Play AAB
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          MYSELFPAY_KEYSTORE_PATH: ${{ runner.temp }}/myselfpay-upload.jks
          MYSELFPAY_KEY_ALIAS: ${{ secrets.MYSELFPAY_KEY_ALIAS }}
          MYSELFPAY_STORE_PASSWORD: ${{ secrets.MYSELFPAY_STORE_PASSWORD }}
          MYSELFPAY_KEY_PASSWORD: ${{ secrets.MYSELFPAY_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify current release bundle and mobile UI assets
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          BUNDLE="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$BUNDLE"
          grep -Eq 'versionCode[[:space:]]+5' android/app/build.gradle
          grep -Eq "versionName[[:space:]]+'1.0.4'" android/app/build.gradle
          unzip -Z1 "$BUNDLE" > /tmp/myselfpay-bundle-entries.txt
          grep -Fx 'base/assets/mobile-flow.css' /tmp/myselfpay-bundle-entries.txt
          grep -Fx 'base/assets/mobile-flow.js' /tmp/myselfpay-bundle-entries.txt
          grep -Fx 'base/assets/mobile-shell.css' /tmp/myselfpay-bundle-entries.txt
          grep -Fx 'base/assets/mobile-shell.js' /tmp/myselfpay-bundle-entries.txt
          grep -E '^base/res/drawable/ic_launcher[^/]*' /tmp/myselfpay-bundle-entries.txt
          echo "MySelfPay v1.0.4 AAB assets verified."
      - name: Upload release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MySelfPay-Play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
