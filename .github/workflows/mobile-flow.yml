name: Mobile flow validation and APK
on:
  push:
    branches: ['fix/mobile-flow-screens']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile flows at three phone widths
        run: node android/tests-mobile-flow.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android app
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare APK
        run: |
          mkdir -p apk-download
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-download/MySelfPay-Mobile-Flow.apk
          sha256sum apk-download/MySelfPay-Mobile-Flow.apk > apk-download/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MySelfPay-Mobile-Flow
          path: apk-download/
          retention-days: 14
