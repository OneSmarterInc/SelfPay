name: Daily retention cleanup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete expired records (false is a dry run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: selfpay-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.SELFPAY_CLEANUP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Require dedicated database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'Configure SELFPAY_CLEANUP_DATABASE_URL for the dedicated review database.'
            exit 1
          fi
      - name: Delete expired records
        if: github.event_name == 'schedule' || inputs.apply
        run: python cleanup.py --apply
      - name: Report expired record counts
        if: github.event_name != 'schedule' && !inputs.apply
        run: python cleanup.py
